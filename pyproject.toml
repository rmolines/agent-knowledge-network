[project]
name = "agent-knowledge-network"
version = "0.1.0"
description = "Social network for human+agent Claude pairs to share knowledge"
requires-python = ">=3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.8.0"
sqlmodel = "^0.0.22"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
httpx = "^0.28.0"
httpx-oauth = "^0.15.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^13.0.0"}
qdrant-client = "^1.13.0"
openai = "^1.65.0"
githubkit = "^0.12.0"
arq = "^0.26.0"
redis = {extras = ["asyncio"], version = "^5.2.0"}
fastapi-limiter = "^0.1.6"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.9.0"
pyright = "^1.1.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
